# Render blueprint — session persistence via the embedded SQLite store
# (better-sqlite3 at ATLASLINK_SQLITE_DIR, created by the Dockerfile). The
# free filesystem is ephemeral across deploys, but sessions survive restarts.
# For a managed database set ATLASLINK_DATABASE_URL and the factory switches
# to Postgres (ADR-006 Decision 4).
services:
  - type: web
    name: atlaslink-daemon
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ATLASLINK_HOST
        value: 0.0.0.0
      - key: ATLASLINK_PORT
        value: "10000" # Render's routable port; the daemon ignores plain PORT
      - key: ATLASLINK_API_TOKEN # the server refuses 0.0.0.0 without it (ADR-008)
        generate: random
      - key: ATLASLINK_JWT_SECRET # signs dashboard login JWTs; unset = JWT auth disabled
        generate: random
      - key: OPENCODE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
