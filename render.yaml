# Render blueprint — issue #146: session persistence across deploys.
# The free filesystem is ephemeral, so the daemon runs Postgres-backed
# (ATLASLINK_DATABASE_URL). Without it the factory falls back to the
# in-process store and every cold start loses sessions.
services:
  - type: web
    name: atlaslink-daemon
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ATLASLINK_HOST
        value: 0.0.0.0
      - key: ATLASLINK_PORT
        value: "10000" # Render's routable port; the daemon ignores plain PORT
      - key: ATLASLINK_API_TOKEN # the server refuses 0.0.0.0 without it (ADR-008)
        generate: random
      - key: ATLASLINK_DATABASE_URL
        fromDatabase:
          name: atlaslink-pg
          property: connectionString
      - key: OPENCODE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: pg
    name: atlaslink-pg
    # free-tier Postgres is deleted after 30 days of dormancy — upgrade the
    # plan before this carries real production sessions
    plan: free
    databaseName: atlaslink
    user: atlaslink
