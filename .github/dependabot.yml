version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      agenthood:
        patterns:
          - "agenthood"
      dev-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "agenthood"
