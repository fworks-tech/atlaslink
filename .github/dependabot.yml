version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # semantic-release@25 bundles conventional-changelog-writer@8; preset
      # >=8.1 requires writer@9 and breaks every release run (#217).
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      agenthood:
        patterns:
          - "agenthood"
      dev-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "agenthood"

  # The dashboard is a separate package with its own lockfile.
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dashboard:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
