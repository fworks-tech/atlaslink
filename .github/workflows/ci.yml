name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          # Passed via env, never interpolated into the script: the title is
          # attacker-controlled on fork PRs.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --config docs/conventions/commitlint.config.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Skills match the installed agenthood package
        run: node scripts/sync-skills.mjs --check

      - name: Lint
        run: npm run lint

      - name: Federation composition
        run: npm run compose

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage

  # The AWS Caddyfile routes production traffic and is bind-mounted, so a typo
  # would only surface at `caddy reload` after merge. Validate it pre-merge.
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate the AWS Caddyfile
        run: docker run --rm -v "$PWD/deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile

  # Dashboard (M4) quality gates. The dashboard is a separate package with its
  # own lockfile; lint + typecheck are the per-branch gates the milestone
  # breakdown (docs/tasks/m4-live-dashboard.md) commits to.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Unit tests
        working-directory: dashboard
        run: npm test

      - name: Lint
        working-directory: dashboard
        run: npm run lint

  # Secret scanning (the-auditor convention). Empty GITLEAKS_LICENSE covers
  # personal accounts; private org accounts need the free Starter license and
  # set GITLEAKS_LICENSE (the action then fails with its own message).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans PR diffs from the merge-base; a shallow clone leaves
          # the base's parent unresolvable ("unknown revision to the range")
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
