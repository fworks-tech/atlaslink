name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout atlaslink
        uses: actions/checkout@v4
        with:
          path: atlaslink

      - name: Checkout agenthood (sibling file dependency)
        uses: actions/checkout@v4
        with:
          repository: fworks-tech/agenthood
          path: agenthood

      - name: Patch agenthood exports for atlaslink deep imports
        working-directory: agenthood
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.exports = pkg.exports || {};
          const deepImports = [
            'dist/commands/config.js',
            'dist/core/RunEventBus.js',
            'dist/core/types.js',
            'dist/llm/providers/StubProvider.js',
            'dist/llm/types.js',
            'dist/llm/validateApiKeys.js',
            'dist/runtime/ApplicationContext.js',
            'dist/tools/human/AskHumanTool.js',
          ];
          for (const p of deepImports) {
            pkg.exports['./' + p] = './' + p;
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agenthood/package-lock.json
            atlaslink/package-lock.json

      - name: Build agenthood
        working-directory: agenthood
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install atlaslink deps
        working-directory: atlaslink
        run: npm ci

      - name: Typecheck
        working-directory: atlaslink
        run: npm run typecheck

      - name: Lint
        working-directory: atlaslink
        run: npm run lint

      - name: Test
        working-directory: atlaslink
        run: npm test

      - name: Coverage (soft gate)
        working-directory: atlaslink
        run: npm run test:coverage || true

  # Dashboard (M4) quality gates. The dashboard is a separate package with its
  # own lockfile; lint + typecheck are the per-branch gates the milestone
  # breakdown (docs/tasks/m4-live-dashboard.md) commits to.
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Unit tests
        working-directory: dashboard
        run: npm test

      - name: Lint
        working-directory: dashboard
        run: npm run lint

  # Secret scanning (the-auditor convention). Empty GITLEAKS_LICENSE covers
  # personal accounts; private org accounts need the free Starter license and
  # set GITLEAKS_LICENSE (the action then fails with its own message).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans PR diffs from the merge-base; a shallow clone leaves
          # the base's parent unresolvable ("unknown revision to the range")
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
