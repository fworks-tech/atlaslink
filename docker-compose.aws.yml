# AWS deployment overlay (#328) — stacks on the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
#
# Adds the Cosmo router (hermetic image, configs baked in the Dockerfile
# router stage) and swaps the Caddy config for the AWS/staging routes.
services:
  # RDS enforces TLS. The certificate is verified against the RDS global CA
  # bundle downloaded by the deploy (and by runbook §6 on a fresh host);
  # ./certs/ is untracked.
  backend:
    volumes:
      - ./certs/global-bundle.pem:/app/certs/global-bundle.pem:ro
    environment:
      NODE_EXTRA_CA_CERTS: /app/certs/global-bundle.pem

  caddy:
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro

  router:
    build:
      context: .
      target: router
    restart: unless-stopped
    depends_on:
      - backend
